# REINVENT4 staged_learning (reinforcement learning) configuration
# mode        : local_analog
# rule        : near-series optimization around the real active parents (inception-guided)
# prior       : real REINVENT4 prior (Zenodo record 20701824), checksum-verified
# stereochemistry : supported (Mol2Mol prior)
# objectives  : predicted_activity (w=1), taf_consistency (w=0.8), novelty (w=0.2), stereo_validity (w=0.5)
# scoring     : ExternalProcess -> reinvent/score_lbm.py (frozen Phase-4 model + real TAF SMARTS)

run_type = "staged_learning"
device = "cuda"
tb_logdir = "tb_logs"
json_out_config = "_local_analog.json"

[parameters]
prior_file = "/cluster/home/nbhatt04/Low-data-alpah9alpah10-r01-ligand-based/project/priors/reinvent_pubchem.prior"
agent_file = "/cluster/home/nbhatt04/Low-data-alpah9alpah10-r01-ligand-based/project/priors/reinvent_pubchem.prior"
summary_csv_prefix = "local_analog"
use_checkpoint = false
purge_memories = false
batch_size = 64
randomize_smiles = true
isomeric_smiles = true  # stereochemistry supported only by the Mol2Mol prior: True
sample_strategy = "multinomial"
temperature = 1.0

[learning_strategy]
type = "dap"  # Direct Augmented Prior (only supported)
sigma = 128
rate = 0.0001

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 15
minscore = 0.4

[inception]
smiles_file = "/cluster/home/nbhatt04/Low-data-alpah9alpah10-r01-ligand-based/project/reinvent/inception.smi"
memory_size = 100
sample_size = 10

[[stage]]
chkpt_file = "/cluster/home/nbhatt04/Low-data-alpah9alpah10-r01-ligand-based/project/reinvent/out/local_analog/chkpt_local_analog.chkpt"
termination = "simple"
max_score = 0.9
min_steps = 25
max_steps = 100

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "predicted_activity"
weight = 1
params.executable = "/cluster/home/nbhatt04/Low-data-alpah9alpah10-r01-ligand-based/project/venvs/pipeline312/bin/python"
params.args = "/cluster/home/nbhatt04/Low-data-alpah9alpah10-r01-ligand-based/project/reinvent/score_lbm.py"
params.property = "predicted_activity"
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "taf_consistency"
weight = 0.8
params.executable = "/cluster/home/nbhatt04/Low-data-alpah9alpah10-r01-ligand-based/project/venvs/pipeline312/bin/python"
params.args = "/cluster/home/nbhatt04/Low-data-alpah9alpah10-r01-ligand-based/project/reinvent/score_lbm.py"
params.property = "taf_consistency"
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "novelty"
weight = 0.2
params.executable = "/cluster/home/nbhatt04/Low-data-alpah9alpah10-r01-ligand-based/project/venvs/pipeline312/bin/python"
params.args = "/cluster/home/nbhatt04/Low-data-alpah9alpah10-r01-ligand-based/project/reinvent/score_lbm.py"
params.property = "novelty"
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "stereo_validity"
weight = 0.5
params.executable = "/cluster/home/nbhatt04/Low-data-alpah9alpah10-r01-ligand-based/project/venvs/pipeline312/bin/python"
params.args = "/cluster/home/nbhatt04/Low-data-alpah9alpah10-r01-ligand-based/project/reinvent/score_lbm.py"
params.property = "stereo_validity"

[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]
[[stage.scoring.component.MolecularWeight.endpoint]]
name = "MW_window"
weight = 1.0
transform.type = "step"
transform.low = 175.0
transform.high = 550.0

[[stage.scoring.component]]
[stage.scoring.component.SAScore]
[[stage.scoring.component.SAScore.endpoint]]
name = "synthetic_feasibility"
weight = 0.5
transform.type = "double_sigmoid"
transform.low = 1.0
transform.high = 6.0
transform.coef_div = 500.0
transform.coef_si = 20.0
transform.coef_se = 20.0

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name = "curated alerts filter"
weight = 0.0
params.smarts = [
    "[*;r{8-17}]",
    "[#8][#8]",
    "[#6;+]",
    "[#16][#16]",
    "[#7;!n][S;!$(S(=O)=O)]",
    "[#7;!n][#7;!n]",
    "[#16;!s][C;!$(C(=[O,N])[N,O])][#16;!s]",
]
